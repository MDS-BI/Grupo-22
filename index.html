<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Base ERP</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div id="logo-mark"></div><strong id="brand-name">Módulo Base ERP</strong></div>
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Contraer navegación">☰</button>
    </header>
    <aside class="sidebar" id="sidebar">
      <button class="nav-module" data-module="dashboard" id="nav-dashboard" aria-current="page"><span>▦</span><span class="nav-label" id="nav-dashboard-label">Panel</span></button>
      <button class="nav-module" data-module="entities" id="nav-entities"><span>◉</span><span class="nav-label" id="nav-entities-label">Entidades</span></button>
      <button class="nav-module" data-module="documents" id="nav-documents"><span>▤</span><span class="nav-label" id="nav-documents-label">Documentos</span></button>
      <button class="nav-module" data-module="search" id="nav-search"><span>⌕</span><span class="nav-label" id="nav-search-label">Búsqueda</span></button>
    </aside>
    <main class="main-content">
      <section id="view-dashboard" class="view">
        <div class="page-heading"><div><span class="eyebrow">Espacio de trabajo</span><h1 id="dashboard-heading">Módulo Base ERP</h1></div></div>
        <div class="quick-actions">
          <button id="action-new-entity"><span class="action-icon">＋</span><strong id="action-new-entity-title">Nueva Entidad</strong></button>
          <button id="action-new-document"><span class="action-icon">＋</span><strong id="action-new-document-title">Nuevo Documento</strong></button>
          <button id="action-open-entities"><span class="action-icon">◉</span><strong id="action-open-entities-title">Entidades</strong></button>
          <button id="action-find"><span class="action-icon">⌕</span><strong id="action-find-title">Buscar registros</strong></button>
        </div>
        <div class="stats-grid">
          <article class="stat-card"><span id="stat-entities-label">Entidades</span><strong id="stat-entities">0</strong></article>
          <article class="stat-card"><span id="stat-documents-label">Documentos</span><strong id="stat-documents">0</strong></article>
          <article class="stat-card"><span>Estado</span><strong id="stat-statuses">0</strong></article>
          <article class="stat-card"><span>Atrasadas</span><strong id="stat-overdue">0</strong></article>
        </div>
      </section>

      <section id="view-entities" class="view" hidden>
        <h1 id="entities-view-heading">Entidades</h1>
        <div class="two-column">
          <form id="entity-form" novalidate>
            <h2 id="entity-form-heading">Agregar / Editar Entidad</h2>
            <input type="hidden" id="entity-id">
            <div class="field"><label for="name">Nombre</label><input id="name"><small class="field-error" id="error-name"></small></div>
            <div class="field"><label for="code">Código</label><input id="code"><small class="field-error" id="error-code"></small></div>
            <div class="field"><label for="taxId">Identificación fiscal</label><input id="taxId"></div>
            <div class="field"><label for="email">Correo electrónico</label><input id="email" type="email"><small class="field-error" id="error-email"></small></div>
            <div class="field"><label for="phone">Teléfono</label><input id="phone"></div>
            <div class="field"><label for="address">Dirección</label><input id="address"></div>
            <div class="field"><label for="category">Categoría</label><input id="category"><small class="field-error" id="error-category"></small></div>
            <div class="field"><label for="creditLimit">Límite de crédito</label><input id="creditLimit" type="number"><small class="field-error" id="error-creditLimit"></small></div>
            <div class="field"><label for="paymentTerms">Condiciones de pago</label><input id="paymentTerms"><small class="field-error" id="error-paymentTerms"></small></div>
            <div class="field"><label for="targetDate">Fecha objetivo</label><input id="targetDate" type="date"><small class="field-error" id="error-targetDate"></small></div>
            <div id="entity-custom-fields"></div>
            <button class="primary" type="submit" id="entity-submit-button"><span id="submit-button">Guardar Entidad</span></button>
            <div class="entity-feedback" id="entity-feedback"></div>
          </form>
          <section>
            <h2 id="edit-entity-heading">Editar o eliminar la entidad</h2>
            <select id="edit-entity"></select>
            <button id="delete-entity">Eliminar la entidad seleccionada</button>
          </section>
        </div>
      </section>

      <section id="view-documents" class="view" hidden>
        <h1 id="documents-view-heading">Documentos</h1>
        <div class="two-column">
          <form id="document-form" novalidate>
            <h2 id="document-form-heading">Agregar / Editar Documento</h2>
            <input type="hidden" id="document-id">
            <div class="field"><label for="document-entity" id="document-entity-label">Entidad</label><select id="document-entity"></select><small class="field-error" id="error-document-entity"></small></div>
            <div class="field"><label for="series">Serie</label><input id="series"></div>
            <div class="field"><label for="folio">Folio</label><input id="folio" type="number"><small class="field-error" id="error-folio"></small></div>
            <div class="field"><label for="startDate">Fecha de inicio</label><input id="startDate" type="date"><small class="field-error" id="error-startDate"></small></div>
            <div class="field"><label for="endDate">Fecha de fin</label><input id="endDate" type="date"><small class="field-error" id="error-endDate"></small></div>
            <div class="field"><label for="quantity">Cantidad</label><input id="quantity" type="number"><small class="field-error" id="error-quantity"></small></div>
            <div class="field"><label for="subtotal">Subtotal</label><input id="subtotal" type="number"><small class="field-error" id="error-subtotal"></small></div>
            <div class="field"><label for="discount">Descuento</label><input id="discount" type="number"><small class="field-error" id="error-discount"></small></div>
            <div class="field"><label for="taxAmount">Impuesto</label><input id="taxAmount" type="number"></div>
            <div class="field"><label for="totalAmount">Importe total</label><input id="totalAmount" type="number"></div>
            <div class="field"><label for="currency">Moneda</label><input id="currency"></div>
            <div class="field"><label for="docPaymentTerms">Condiciones de pago</label><input id="docPaymentTerms"></div>
            <div class="field"><label for="notes">Notas</label><input id="notes"></div>
            <div class="field"><label for="status">Estado</label><select id="status"><option value=""></option></select></div>
            <div id="document-custom-fields"></div>
            <button class="primary" type="submit" id="document-submit-button">Guardar Documento</button>
            <div class="document-feedback" id="document-feedback"></div>
          </form>
          <section>
            <h2 id="edit-document-heading">Editar o eliminar el documento</h2>
            <select id="edit-document"></select>
            <button id="delete-document">Eliminar el documento seleccionado</button>
            <div id="document-list"></div>
          </section>
        </div>
      </section>

      <section id="view-search" class="view" hidden>
        <h1 id="search-view-heading">Buscar Entidades</h1>
        <div class="field"><label for="search-input">Buscar</label><input id="search-input" type="search"></div>
        <div id="search-results-list"></div>
        <div id="search-empty" hidden>No se encontraron coincidencias.</div>
      </section>
    </main>
  </div>
  <div id="config-warning" class="config-warning" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
